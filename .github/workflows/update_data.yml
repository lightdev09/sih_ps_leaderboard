name: Update SIH Problem Statement Data

on:
  schedule:
    - cron: '0 */6 * * *' # Runs every 6 hours (when your PC is on)
  workflow_dispatch: # Manual trigger via GitHub UI

permissions:
  contents: write

jobs:
  scrape-and-update:
    runs-on: self-hosted
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Scrape SIH Problem Statements
        run: |
          python scripts/sih_ps_ranker.py --headless

      - name: Recompile Dashboard
        run: |
          python scripts/update_dashboard.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ index.html
          if git diff --staged --quiet; then
            echo "No new updates to commit."
          else
            git commit -m "Auto-update SIH 2026 problem statements [skip ci]"
            git push
          fi
