name: Update SIH Problem Statement Data

on:
  schedule:
    - cron: '0 */6 * * *' # Runs automatically every 6 hours
  workflow_dispatch: # Allows manual execution via GitHub UI button

permissions:
  contents: write

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Scrape SIH Problem Statements (Headless)
        run: |
          python scripts/sih_ps_ranker.py --headless

      - name: Recompile Dashboard
        run: |
          python scripts/update_dashboard.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ index.html
          if git diff --staged --quiet; then
            echo "No new updates to commit."
          else
            git commit -m "Auto-update SIH 2026 problem statements [skip ci]"
            git push
          fi

